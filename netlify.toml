# Netlify deploy config for this Vite static site.
# (Vercel needs no config — it auto-detects Vite: build `npm run build`, output `dist`.)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Long-cache the fingerprinted build assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
